name: Browser smoke

on:
  push:
    branches:
      - audit-fixes-2026-10-05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/s1-http.log 2>&1 &
          echo $! > /tmp/s1-http.pid
          sleep 2
      - name: Run browser smoke
        run: node scripts/browser-smoke.mjs
